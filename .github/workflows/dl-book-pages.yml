name: Deploy DL Book

on:
  push:
    branches:
      - master
    paths:
      - "docs/dl-book/**"
      - ".github/workflows/dl-book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dl-book-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dl-book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
