name: Deploy DL Book

on:
  push:
    branches:
      - master
    paths:
      - "docs/dl-book/**"
      - ".github/workflows/dl-book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dl-book-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install build tools
        run: |
          retry() {
            local max=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              echo "Attempt $attempt failed; retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          retry sudo apt-get update
          retry sudo apt-get install -y build-essential cmake wget

      - name: Restore MNIST demo model cache
        uses: actions/cache@v6
        with:
          path: src/demo/mnist/mnist/demo.v2.param
          key: ${{ runner.os }}-dl-book-mnist-demo-v2-param-v1

      - name: Restore TicTacToe demo asset cache
        uses: actions/cache@v6
        with:
          path: docs/dl-book/assets/demos/tictactoe/q_table.json
          key: ${{ runner.os }}-dl-book-tictactoe-q-table-v2

      - name: Generate demo assets
        run: docs/dl-book/tools/build_demo_assets.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs/dl-book

      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before deploy retry 2
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before deploy retry 3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment_3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Fail after deploy retries
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure' && steps.deployment_3.outcome == 'failure'
        run: |
          echo "GitHub Pages deployment failed after 3 attempts."
          exit 1
