name: Check DL Book

on:
  push:
    branches:
      - master
    paths:
      - "docs/dl-book/**"
      - ".github/workflows/dl-book-check.yml"
  pull_request:
    paths:
      - "docs/dl-book/**"
      - ".github/workflows/dl-book-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check anchors (跨节/跨章链接是否指向存在的锚点)
        run: |
          retry() {
            local max=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              echo "Attempt $attempt failed; retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          retry python3 docs/dl-book/tools/check_anchors.py

      - name: Check structure (HTML 良构 + h2 编号连续)
        run: |
          retry() {
            local max=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              echo "Attempt $attempt failed; retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          retry python3 docs/dl-book/tools/check_structure.py
