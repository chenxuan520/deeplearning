name: Check DL Book

on:
  push:
    branches:
      - master
    paths:
      - "docs/dl-book/**"
      - ".github/workflows/dl-book-check.yml"
  pull_request:
    paths:
      - "docs/dl-book/**"
      - ".github/workflows/dl-book-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check anchors (跨节/跨章链接是否指向存在的锚点)
        run: python3 docs/dl-book/tools/check_anchors.py

      - name: Check structure (HTML 良构 + h2 编号连续)
        run: python3 docs/dl-book/tools/check_structure.py
